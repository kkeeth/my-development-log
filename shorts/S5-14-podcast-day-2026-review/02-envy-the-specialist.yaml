captions: |
  潰しが全然|効かなくなるんで
  その技術そのものが|もうこの先使われません
  みたいな時代になると|手札が急に無くなっちゃう
  リスクもある強みだと|分かった上で
  進まれるならどうぞ|と思います
  いやでも これはね|僕は羨ましいですよね
  やっぱり強みが|あるというのは
  そうなりたかったし
  他の人が届かない世界に|自分は届いて
  そこを歩んでいけるのは
  気持ちいいんじゃ|ないですかね
  見えてるものも|違うでしょうし
  僕はそうなれなかったので|幅を取る道
  スペシャリストじゃなくて|ジェネラリスト
  手札を増やす方法です
