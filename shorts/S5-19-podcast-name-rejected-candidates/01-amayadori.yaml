captions: |
  とにかく|情報量が多すぎる
  僕はそれを|よく雨に例えてるんですね
  雨って結構|嫌われがちだと|思いますけど
  僕は雨が大好きで
  雨が全く降らない世界は|人間の暮らしとしては|ナンセンス
  大きな役割を|担っているのが雨なんです
  ただ 今の情報の雨は|多すぎる
  だからこそ|ちょっとだけ雨宿りを|してほしい
  傘をさして|雨を防ぐでもいいんですけど
  軒先で少しだけ|雨をよけて
  その間に|ちゃんと休む
  車でいうと|アイドリングのような時間
  その時間に|雑談とか小噺を|聞いてもらって
  ギアをいったん止めて|一休みする
  そういうひとときを|届けたくて
  「雨宿り」と|付けました
