captions: |
  エンジニアの休日.fm
  これはですね|元ネタがありまして
  吹奏楽やってる人は|たぶん聞いたことがある曲
  「トランペット吹きの|休日」という曲
  この名前から|取ってきてます
  テンポが|むっちゃ速いんですよ
  休日って|タイトルをつけておきながら
  疾走感抜群
  演奏者|絶対忙しいんですよ
  そのギャップも面白くて
  エンジニアって|休日こそ
  自分の能力を発揮する人が|多かったりします
  いや それ仕事でやれよ|ってツッコミは|あるんですけど
  好きな開発をしたり|好きな勉強をしたり
  技術とか才能の|無駄遣いをして|面白いものを作ったり
  だからこそ|休日のエンジニアみたいに
  趣味全開の話をする番組って|いいんじゃないかなと
  今でも|これに変えても|いいんじゃないか
  と思っちゃうぐらいです
