captions: |
  「声のサイエンス」|という本の中に
  声は嘘をつかない|と書いてあって
  例えば政治の場で|この人が嘘をついてるのも
  声を聞けば分かる|と書いている書籍があって
  これポッドキャスターを|始めた時に読んだんですけど
  だから自分も番組の中で
  この機材 微妙なんだけどな|でも今安いから
  紹介しようかなって思う時が|たまにあるんですよ
  でも いやこれダメだ
  これ言ったらリスナーさんに|絶対声でバレるから
  自分の本当の気持ちを|注入しようみたいな感じで
  いつもやってますね
